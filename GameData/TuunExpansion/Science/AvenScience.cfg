// Tuun Expansion - Aven science flavor
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    @RESULTS
    {
        AvenFlyingLow = Aven's teal and green terrain slides beneath a thin atmospheric haze, broken by basins, rifts, and uplands.
        AvenFlyingHigh = The atmosphere becomes transparent enough to reveal Aven's broad regional color and elevation changes.
        AvenInSpaceLow = Aven is unexpectedly colorful from orbit, with pale poles and darker lowlands surrounding raised terrain.
        AvenInSpaceHigh = The moon hangs beside Rem as a compact, distinctly terrestrial-looking world.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    @RESULTS
    {
        AvenSrfLanded = The terrain feels familiar in scale, but the colors and distant presence of Rem make the landscape unmistakably alien.
        AvenSrfLandedRiftValleys = The valley walls expose long bands of fractured material.
        AvenSrfLandedCrateredUplands = Raised cratered terrain gives a commanding view across the surrounding regions.
        AvenSrfLandedPolarFrostlands = Pale deposits coat the cold ground toward the pole.
        AvenInSpaceLow = The boundary between Aven's lowlands and raised terrain is obvious from low orbit.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    @RESULTS
    {
        AvenSrfLandedVerdantLowlands = Dark, fine-grained material dominates the lowlands.
        AvenSrfLandedTealHighlands = The highland rock is coarse, weathered, and chemically distinct from the plains below.
        AvenSrfLandedAncientBasins = Impact-processed material fills the old basin floor.
        AvenSrfLandedEquatorialPlains = Fine deposits form broad, comparatively smooth equatorial terrain.
        AvenSrfLandedRiftValleys = Fresh fractured surfaces expose less-weathered material beneath the valley floor.
        AvenSrfLandedPolarFrostlands = The sample contains pale volatile-rich surface deposits mixed with local regolith.
        AvenSrfLandedCrateredUplands = Angular ejecta fragments are mixed throughout the elevated cratered terrain.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    @RESULTS
    {
        AvenSrfLanded = The surface temperature is moderated by Aven's atmosphere but varies noticeably with terrain and latitude.
        AvenFlyingLow = The lower atmosphere produces a clear vertical temperature gradient.
        AvenFlyingHigh = Temperatures fall as the instrument climbs toward the edge of the atmosphere.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    @RESULTS
    {
        AvenSrfLanded = The instrument confirms a substantial but manageable atmosphere at the surface.
        AvenFlyingLow = Pressure decreases steadily above the terrain.
        AvenFlyingHigh = Only the thin upper reaches of Aven's atmosphere remain.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    @RESULTS
    {
        AvenSrfLanded = The local gravity reading provides a baseline for Aven's internal structure.
        AvenInSpaceLow = Small orbital variations help map the distribution of mass beneath Aven's varied terrain.
    }
}
