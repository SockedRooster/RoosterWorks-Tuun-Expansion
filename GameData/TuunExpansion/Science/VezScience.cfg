// v0.20.29 Vez: exact internal biome IDs; stock experiments unchanged.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        VezSrfLandedBasins = The instruments locate the craft in Vez's Basins.
        VezSrfLandedMidlands = The instruments locate the craft in Vez's Midlands.
        VezSrfLandedHighlands = The instruments locate the craft in Vez's Highlands.
        VezSrfLandedPolar = The instruments locate the craft in Vez's Polar Terrain.
        VezInSpaceLow = Low-orbit observations reveal Vez's regional structure.
        VezInSpaceHigh = Vez stands out against the distant Tuun system.
    }
}

