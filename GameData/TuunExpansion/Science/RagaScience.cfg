// Raga biome-specific stock experiment descriptions.
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:NEEDS[TuunExpansion]:FINAL
{
    %RESULTS
    {
        RagaSrfLandedBasins = The slate basin floor contains fine impact debris and ancient fractured rock.
        RagaSrfLandedMidlands = Mixed regolith and angular fragments record repeated bombardment.
        RagaSrfLandedHighlands = Pale highland rock preserves a long history of exposed crust.
        RagaSrfLandedPolar = Cold polar regolith contains unusually well-preserved impact material.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:NEEDS[TuunExpansion]:FINAL
{
    %RESULTS
    {
        RagaSrfLandedBasins = The dark basin stretches between pale ridges and battered scarps.
        RagaSrfLandedMidlands = Loose fragments crunch beneath your boots on the uneven plains.
        RagaSrfLandedHighlands = The exposed plateau offers a sweeping view across ancient impact terrain.
        RagaSrfLandedPolar = The low sun throws long shadows across the polar surface.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[TuunExpansion]:FINAL
{
    %RESULTS
    {
        RagaSrfLandedBasins = The instruments show a stable landing in a broad slate basin.
        RagaSrfLandedMidlands = A rough mosaic of craters and ridges surrounds the landing site.
        RagaSrfLandedHighlands = Raga's highlands appear unusually pale from the cabin windows.
        RagaSrfLandedPolar = The polar horizon is broken by ridges and deep shadows.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:NEEDS[TuunExpansion]:FINAL
{
    %RESULTS
    {
        RagaSrfLandedBasins = The basin gravity signature suggests dense buried impact structures.
        RagaSrfLandedMidlands = Subtle gravity variations track the fractured midland crust.
        RagaSrfLandedHighlands = The plateau's gravity anomaly hints at an ancient thickened crust.
        RagaSrfLandedPolar = Gravity measurements reveal buried structures beneath polar regolith.
    }
}
