// v0.20.29 Kol: exact internal biome IDs; stock experiments unchanged.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        KolSrfLandedBasins = The instruments locate the craft in Kol's Basins.
        KolSrfLandedPlains = The instruments locate the craft in Kol's Plains.
        KolSrfLandedHighlands = The instruments locate the craft in Kol's Highlands.
        KolSrfLandedPolar = The instruments locate the craft in Kol's Polar Terrain.
        KolInSpaceLow = Low-orbit observations reveal Kol's regional structure.
        KolInSpaceHigh = Kol stands out against the distant Tuun system.
    }
}

