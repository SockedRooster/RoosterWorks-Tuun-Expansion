// Tuun Expansion - Rem science flavor
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    @RESULTS
    {
        RemFlyingLow = Rem's thick, lightweight atmosphere softens the horizon into muted rose-brown bands while the terrain drifts beneath the haze.
        RemFlyingHigh = The atmosphere thins enough to reveal broad belts, basins, and uplands through the dusty veil below.
        RemInSpaceLow = From low orbit, Rem's subdued terrain resolves into immense regional structures beneath a surprisingly deep atmosphere.
        RemInSpaceHigh = Rem appears oversized for its gravity, a swollen world wrapped in a broad atmospheric envelope.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    @RESULTS
    {
        RemSrfLanded = The weak gravity and dense atmosphere make every movement feel slightly unreal.
        RemSrfLandedAncientBasins = The basin floor is broad and dry, enclosed by weathered impact relief.
        RemSrfLandedBillowingHighlands = The highlands rise gently but persistently above the surrounding plains.
        RemSrfLandedRiftedUplands = Broken slopes and long troughs cut across the upland terrain.
        RemInSpaceLow = Rem's hazy limb seems unusually thick for a world with such modest surface gravity.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    @RESULTS
    {
        RemSrfLandedDusklowPlains = Fine, dark material has accumulated across the subdued plains.
        RemSrfLandedBillowingHighlands = The highland sample is coarser and less weathered than material from the lower plains.
        RemSrfLandedAncientBasins = Shocked and reworked material hints at an old impact origin for the basin.
        RemSrfLandedEquatorialBelts = Layered grains suggest persistent atmospheric transport along Rem's equatorial regions.
        RemSrfLandedRiftedUplands = Fractured rock exposes material from beneath Rem's weathered surface.
        RemSrfLandedPolarExpanses = Pale, fine-grained material dominates the colder polar terrain.
        RemSrfLandedImpactScars = The sample contains angular fragments and shock-altered minerals from ancient impacts.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    @RESULTS
    {
        RemSrfLanded = Rem's surface is warm beneath its insulating atmosphere.
        RemFlyingLow = Temperature changes slowly through the dense lower atmosphere.
        RemFlyingHigh = The upper atmosphere is markedly colder than the surface layers.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    @RESULTS
    {
        RemSrfLanded = The barometer confirms a remarkably deep atmosphere for a world with such low surface gravity.
        RemFlyingLow = Pressure remains substantial far above the terrain.
        RemFlyingHigh = The instrument finally records the long decline toward vacuum.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    @RESULTS
    {
        RemSrfLanded = The reading confirms Rem's low surface gravity despite its imposing size.
        RemInSpaceLow = Orbital measurements reinforce the impression that Rem is unusually low-density.
    }
}
