// Tuun Expansion - Hurr science flavor
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    @RESULTS
    {
        HurrFlyingLow = The cabin groans under Hurr's crushing atmosphere. Outside, the horizon disappears into copper-colored haze.
        HurrFlyingHigh = Layered clouds hide the surface while Tuun's light scatters through the upper atmosphere.
        HurrInSpaceLow = Hurr fills the windows: a furnace-colored world almost completely concealed by cloud and haze.
        HurrInSpaceHigh = From here, Hurr looks deceptively calm for a world with such extreme surface conditions.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    @RESULTS
    {
        HurrSrfLanded = Standing outside on Hurr is an engineering achievement all by itself.
        HurrSrfLandedRiftValleys = The rift walls expose dark layers beneath Hurr's weathered surface.
        HurrSrfLandedSulfurPlains = Yellow-orange deposits coat the ground and cling to every exposed surface.
        HurrInSpaceLow = Hurr's cloud deck stretches from horizon to horizon beneath you.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    @RESULTS
    {
        HurrSrfLandedScorchedLowlands = The sample is dense, heat-altered rock coated in atmospheric deposits.
        HurrSrfLandedAshenHighlands = The highland material is rough, oxidized, and noticeably different from the lowlands.
        HurrSrfLandedSulfurPlains = The sample contains abundant sulfur-rich surface deposits.
        HurrSrfLandedRiftValleys = Freshly exposed material suggests comparatively recent tectonic activity.
        HurrSrfLandedImpactBasins = Shocked minerals provide evidence of a violent impact history.
        HurrSrfLandedPolarPlateaus = Cooler conditions have preserved surface chemistry that is scarce near the equator.
        HurrSrfLandedTerminatorRidges = The ridge sample shows intense weathering from Hurr's dense, circulating atmosphere.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    @RESULTS
    {
        HurrSrfLanded = The thermometer considers filing a formal complaint.
        HurrFlyingLow = Temperatures remain punishing even well above the surface.
        HurrFlyingHigh = The upper atmosphere is dramatically cooler than the inferno below.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]
{
    @RESULTS
    {
        HurrSrfLanded = The instrument confirms an extraordinary surface pressure: roughly forty times Kerbin sea level.
        HurrFlyingLow = Pressure remains enormous; this atmosphere behaves more like an ocean of gas.
        HurrFlyingHigh = The pressure finally begins falling into ranges familiar to conventional spacecraft.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    @RESULTS
    {
        HurrSrfLanded = Hurr's strong surface gravity leaves no doubt that this is a super-Kerbin.
        HurrInSpaceLow = Gravity readings help constrain the mass distribution beneath the cloud-hidden surface.
    }
}

// v0.10.0 Hurr science expansion
@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]
{
    @RESULTS
    {
        HurrFlyingLow = The analyzer finds a massive, hot, non-oxygen atmosphere dominated by heavy gases and suspended aerosols.
        HurrFlyingHigh = The upper atmosphere is much thinner, but the same heavy-gas signature and fine haze remain detectable.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]
{
    @RESULTS
    {
        HurrSrfLandedScorchedLowlands = Low-frequency vibrations travel efficiently through the dense crust beneath the lowlands.
        HurrSrfLandedRiftValleys = The sensor records persistent microseismic activity along the fractured rift terrain.
        HurrSrfLandedImpactBasins = Buried fractured layers produce a complex pattern of reflected seismic waves.
        HurrSrfLandedAshenHighlands = The highland crust appears thicker and more rigid than the surrounding low terrain.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]
{
    @RESULTS
    {
        HurrSrfLanded = The Goo slumps heavily in Hurr's gravity and appears deeply offended by the heat.
        HurrFlyingLow = The Goo compresses under the enormous atmospheric pressure and jiggles only reluctantly.
        HurrFlyingHigh = With pressure falling rapidly, the Goo begins behaving almost normally again.
        HurrInSpaceLow = The Goo relaxes as Hurr's copper cloud deck rolls silently below.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]
{
    @RESULTS
    {
        HurrSrfLanded = Several samples discolor almost immediately in the heat and chemically aggressive atmosphere.
        HurrFlyingLow = Dense hot gas works its way into every exposed sample chamber.
        HurrFlyingHigh = Fine atmospheric particles settle across the materials bay as the craft crosses the upper haze.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    @RESULTS
    {
        HurrSrfLandedScorchedLowlands = Heat shimmer and copper haze reduce the horizon to a dim blur over the lowlands.
        HurrSrfLandedAshenHighlands = The high ground rises above darker valleys, but the dense atmosphere still hides distant terrain.
        HurrSrfLandedImpactBasins = The basin walls fade into orange-brown haze long before reaching the horizon.
        HurrSrfLandedPolarPlateaus = The plateau is still brutally hot, though conditions are marginally less extreme than at lower latitudes.
        HurrSrfLandedTerminatorRidges = Long shadows cut across the ridge while turbulent haze glows in Tuun's low light.
    }
}
