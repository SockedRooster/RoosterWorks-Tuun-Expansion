// Tuun Expansion - Flot science flavor
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
    @RESULTS
    {
        FlotInSpaceLow = Flot's rust-colored basins, crater fields, and sharp ridges pass quickly beneath the spacecraft.
        FlotInSpaceHigh = The small moon looks battered and ancient against the enormous presence of Rem.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]
{
    @RESULTS
    {
        FlotSrfLanded = The horizon is close, the gravity is weak, and Rem dominates the sky.
        FlotSrfLandedVolcanicRidges = The ridge crest exposes dark, resistant material above the surrounding terrain.
        FlotSrfLandedCraterFields = Overlapping impacts leave almost no untouched ground in sight.
        FlotInSpaceLow = Individual crater chains and ridges are easy to trace from this altitude.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
    @RESULTS
    {
        FlotSrfLandedRustBasins = Fine reddish regolith has collected across the basin floor.
        FlotSrfLandedAncientHighlands = The sample is heavily fractured and records a long history of impacts.
        FlotSrfLandedCraterFields = The regolith is a chaotic mixture of ejecta from many different impacts.
        FlotSrfLandedEquatorialDunes = Loose grains have formed dune-like deposits despite the absence of a substantial atmosphere.
        FlotSrfLandedScarredLowlands = Dark impact-mixed material fills the low terrain.
        FlotSrfLandedPolarWastes = The polar sample is pale, cold, and unusually fine-grained.
        FlotSrfLandedVolcanicRidges = Dense dark rock suggests an ancient volcanic or intrusive origin for the ridge material.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[temperatureScan]]
{
    @RESULTS
    {
        FlotSrfLanded = With almost no atmosphere to redistribute heat, surface temperature depends strongly on illumination.
    }
}
@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]
{
    @RESULTS
    {
        FlotSrfLanded = Flot's weak gravity barely holds the spacecraft against the surface.
        FlotInSpaceLow = Small variations in the reading hint at an irregular internal mass distribution.
    }
}
