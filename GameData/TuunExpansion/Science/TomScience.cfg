// Tom biome-specific science descriptions. Biome IDs match Tom.cfg exactly.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        TomSrfLandedBasins = The ancient basin floor is packed with fine impact dust and weathered volcanic debris.
        TomSrfLandedMidlands = Broken volcanic plains transition between the deep basins and elevated ridges.
        TomSrfLandedHighlands = The uplands expose rugged, heat-altered rock.
        TomSrfLandedPolar = Cold polar terrain preserves an unusually rough, ancient surface.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        TomSrfLandedBasins = A shallow layer of dark mineral grains covers compacted basalt beneath.
        TomSrfLandedMidlands = The sample contains rust-colored grains mixed with weathered basalt.
        TomSrfLandedHighlands = Angular fragments reveal layers of iron-rich volcanic material.
        TomSrfLandedPolar = The polar regolith contains brittle dark grains and pale mineral dust.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        TomSrfLandedBasins = The broad depression looks like a frozen sea of dust, but there is no water.
        TomSrfLandedMidlands = Scattered stones suggest the midlands have been fractured and reworked for ages.
        TomSrfLandedHighlands = Large blocks and rubble make the highlands a challenging landing site.
        TomSrfLandedPolar = Low-angle light brings out every ridge and fracture in the polar ground.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[gravityScan]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        TomSrfLandedBasins = The instruments detect a dense, ancient crust beneath the basin sediments.
        TomSrfLandedMidlands = Subsurface density varies sharply across old lava boundaries.
        TomSrfLandedHighlands = The gravimeter registers buried ridges and dense intrusive rock.
        TomSrfLandedPolar = The polar crust shows evidence of long-term thermal stress.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        TomInSpaceLow = Tavool looms beyond Tom while its ancient volcanic scars become visible from orbit.
        TomInSpaceHigh = Tom appears as a rust-colored moon with contrasting dark basins and rough uplands.
    }
}
