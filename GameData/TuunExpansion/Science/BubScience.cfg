// v0.20.29 Bub: exact internal biome IDs; stock experiments unchanged.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        BubSrfLandedBasins = The instruments locate the craft in Bub's Basins.
        BubSrfLandedMidlands = The instruments locate the craft in Bub's Midlands.
        BubSrfLandedHighlands = The instruments locate the craft in Bub's Highlands.
        BubSrfLandedPolar = The instruments locate the craft in Bub's Polar Terrain.
        BubInSpaceLow = Low-orbit observations reveal Bub's regional structure.
        BubInSpaceHigh = Bub stands out against the distant Tuun system.
    }
}

