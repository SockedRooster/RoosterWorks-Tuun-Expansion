// v0.20.29 Arktane: exact internal biome IDs; stock experiments unchanged.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        ArktaneSrfLandedBasins = The instruments locate the craft in Arktane's Dark Cryobasins.
        ArktaneSrfLandedPlains = The instruments locate the craft in Arktane's Frozen Plains.
        ArktaneSrfLandedHighlands = The instruments locate the craft in Arktane's Glacial Highlands.
        ArktaneSrfLandedPolar = The instruments locate the craft in Arktane's Polar Ice.
        ArktaneInSpaceLow = Low-orbit observations reveal Arktane's regional structure.
        ArktaneInSpaceHigh = Arktane stands out against the distant Tuun system.
        ArktaneFlyingLow = The lower atmosphere veils Arktane's terrain.
        ArktaneFlyingHigh = The thinning atmosphere reveals Arktane's curved horizon.
    }
}

