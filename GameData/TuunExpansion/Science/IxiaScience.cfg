// v0.20.29 Ixia: exact internal biome IDs; stock experiments unchanged.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        IxiaSrfLandedBasins = The instruments locate the craft in Ixia's Ancient Basins.
        IxiaSrfLandedPlains = The instruments locate the craft in Ixia's Frozen Lowlands.
        IxiaSrfLandedHighlands = The instruments locate the craft in Ixia's Frosted Highlands.
        IxiaSrfLandedPolar = The instruments locate the craft in Ixia's Polar Frostfields.
        IxiaInSpaceLow = Low-orbit observations reveal Ixia's regional structure.
        IxiaInSpaceHigh = Ixia stands out against the distant Tuun system.
        IxiaFlyingLow = The lower atmosphere veils Ixia's terrain.
        IxiaFlyingHigh = The thinning atmosphere reveals Ixia's curved horizon.
    }
}

