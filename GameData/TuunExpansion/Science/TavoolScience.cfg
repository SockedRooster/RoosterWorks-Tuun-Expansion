// Tavool is a gas giant: no surface or splashed results.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        TavoolInSpaceLow = Tavool fills the sky with sweeping cloud bands and immense atmospheric depth.
        TavoolInSpaceHigh = The ringed giant anchors its broad family of moons.
        TavoolFlyingHigh = The upper atmosphere gives way to deeper cloud layers below.
        TavoolFlyingLow = Pressure and temperature climb in the giant's deep atmosphere; no solid surface is visible.
    }
}

