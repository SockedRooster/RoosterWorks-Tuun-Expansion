// v0.20.29 Skab: exact internal biome IDs; stock experiments unchanged.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        SkabSrfLandedBasins = The instruments locate the craft in Skab's Basins.
        SkabSrfLandedPlains = The instruments locate the craft in Skab's Plains.
        SkabSrfLandedHighlands = The instruments locate the craft in Skab's Highlands.
        SkabSrfLandedPolar = The instruments locate the craft in Skab's Polar Terrain.
        SkabInSpaceLow = Low-orbit observations reveal Skab's regional structure.
        SkabInSpaceHigh = Skab stands out against the distant Tuun system.
    }
}

