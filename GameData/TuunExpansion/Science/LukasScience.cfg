// v0.20.29 Lukas: exact internal biome IDs; stock experiments unchanged.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        LukasSrfSplashedOcean = The instruments locate the craft in Lukas's Open Ocean.
        LukasSrfLandedCoasts = The instruments locate the craft in Lukas's Sheltered Coasts.
        LukasSrfLandedLowlands = The instruments locate the craft in Lukas's Verdant Lowlands.
        LukasSrfLandedHighlands = The instruments locate the craft in Lukas's Continental Highlands.
        LukasSrfLandedMountains = The instruments locate the craft in Lukas's Mountain Ranges.
        LukasSrfLandedPolar = The instruments locate the craft in Lukas's Polar Icefields.
        LukasInSpaceLow = Low-orbit observations reveal Lukas's regional structure.
        LukasInSpaceHigh = Lukas stands out against the distant Tuun system.
        LukasFlyingLow = The lower atmosphere veils Lukas's terrain.
        LukasFlyingHigh = The thinning atmosphere reveals Lukas's curved horizon.
    }
}

