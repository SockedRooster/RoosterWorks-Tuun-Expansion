@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]
{
 @RESULTS
 {
  VerdaSrfLanded = The horizon seems permanently divided between fire and frost. Verda's twilight belt feels like the only compromise this world ever made.
  VerdaFlyingLow = Verda's rugged terminator ridges slide beneath the craft while the sun hangs nearly fixed in the sky.
  VerdaInSpaceLow = From orbit, the locked hemispheres and narrow twilight geography are unmistakable.
 }
}
@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]
{
 @RESULTS
 {
  VerdaSrfLandedTwilightBasins = Fine dark grains collect in sheltered twilight depressions.
  VerdaSrfLandedSunwardHighlands = Heat-altered rock dominates the exposed sunward highlands.
  VerdaSrfLandedEmberPlains = The sample is dry, oxidized, and thermally weathered.
  VerdaSrfLandedTerminatorRidges = Fractured stone records severe thermal cycling near the permanent twilight line.
  VerdaSrfLandedNightsideLowlands = The sample is intensely cold and carries frost trapped between grains.
  VerdaSrfLandedFrostedUplands = Pale frost coats rough elevated rock.
  VerdaSrfLandedPolarFrost = Volatiles persist in the cold polar regolith.
  VerdaSrfLandedImpactScars = Shocked minerals and brecciated fragments mark an ancient impact.
  VerdaSrfLandedAncientPlateaus = Dense weathered crust suggests very old terrain.
  VerdaSrfLandedRiftValleys = Fresh fractured material is exposed along the rift floor.
 }
}
