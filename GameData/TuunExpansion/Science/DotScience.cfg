// v0.20.29 Dot: exact internal biome IDs; stock experiments unchanged.
@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        DotSrfLandedBasins = The instruments locate the craft in Dot's Basins.
        DotSrfLandedMidlands = The instruments locate the craft in Dot's Midlands.
        DotSrfLandedHighlands = The instruments locate the craft in Dot's Highlands.
        DotSrfLandedPolar = The instruments locate the craft in Dot's Polar Terrain.
        DotInSpaceLow = Low-orbit observations reveal Dot's regional structure.
        DotInSpaceHigh = Dot stands out against the distant Tuun system.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        DotSrfLandedBasins = The view across Basins reveals Dot's distinctive terrain.
        DotSrfLandedMidlands = The view across Midlands reveals Dot's distinctive terrain.
        DotSrfLandedHighlands = The view across Highlands reveals Dot's distinctive terrain.
        DotSrfLandedPolar = The view across Polar Terrain reveals Dot's distinctive terrain.
        DotInSpaceLow = Low-orbit observations reveal Dot's regional structure.
        DotInSpaceHigh = Dot stands out against the distant Tuun system.
    }
}

@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]:NEEDS[PromisedWorlds]
{
    @RESULTS
    {
        DotSrfLandedBasins = Material from Dot's Basins contains fine gray regolith and angular impact debris.
        DotSrfLandedMidlands = Material from Dot's Midlands contains fine gray regolith and angular impact debris.
        DotSrfLandedHighlands = Material from Dot's Highlands contains fine gray regolith and angular impact debris.
        DotSrfLandedPolar = Material from Dot's Polar Terrain contains fine gray regolith and angular impact debris.
    }
}

